<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220"><style>
text{font-family:'JetBrains Mono','Fira Code','Segoe UI',monospace}
.t{fill:#00D4FF;font-size:15px;font-weight:700}
.l{fill:#9AA0B4;font-size:11.5px}
.v{fill:#FFFFFF;font-size:14px;font-weight:700}
.big{fill:#FFFFFF;font-size:30px;font-weight:800}
.row{opacity:0;animation:in .7s ease-out forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.cur{animation:blink 1s steps(1) infinite}
.ring{stroke-dashoffset:var(--c);animation:ring 1.8s ease-out .4s forwards}
.lap{stroke-dasharray:30 70;animation:lap 5s linear infinite}
.scan{animation:scan 4s linear infinite}
.sw{animation:sweep 5s linear infinite}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flame 1.2s ease-in-out infinite}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards}
.cell{opacity:0;transform-box:fill-box;transform-origin:center;animation:cellin .5s ease-out forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.5s ease-out .5s forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{to{stroke-dashoffset:var(--o)}}
@keyframes lap{to{stroke-dashoffset:-100}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(320px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(900px)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
@keyframes flame{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.92)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes cellin{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090A0F"/><stop offset=".6" stop-color="#14213D"/><stop offset="1" stop-color="#241466"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#6C3BFF"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><clipPath id="c"><rect width="410" height="220" rx="14"/></clipPath><rect x=".5" y=".5" width="409" height="219" rx="14" fill="url(#bg)"/><g clip-path="url(#c)"><circle cx="17" cy="216" r="1.2" fill="#00D4FF" style="animation:float 3s linear 0.00s infinite"/><circle cx="70" cy="216" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 0.45s infinite"/><circle cx="123" cy="216" r="2.4" fill="#00D4FF" style="animation:float 5s linear 0.90s infinite"/><circle cx="176" cy="216" r="1.2" fill="#6C3BFF" style="animation:float 6s linear 1.35s infinite"/><circle cx="229" cy="216" r="1.8" fill="#00D4FF" style="animation:float 3s linear 1.80s infinite"/><circle cx="282" cy="216" r="2.4" fill="#6C3BFF" style="animation:float 4s linear 2.25s infinite"/><circle cx="335" cy="216" r="1.2" fill="#00D4FF" style="animation:float 5s linear 2.70s infinite"/><circle cx="388" cy="216" r="1.8" fill="#6C3BFF" style="animation:float 6s linear 3.15s infinite"/><circle cx="31" cy="216" r="2.4" fill="#00D4FF" style="animation:float 3s linear 3.60s infinite"/><circle cx="84" cy="216" r="1.2" fill="#6C3BFF" style="animation:float 4s linear 4.05s infinite"/><circle cx="137" cy="216" r="1.8" fill="#00D4FF" style="animation:float 5s linear 4.50s infinite"/><circle cx="190" cy="216" r="2.4" fill="#6C3BFF" style="animation:float 6s linear 4.95s infinite"/><circle cx="243" cy="216" r="1.2" fill="#00D4FF" style="animation:float 3s linear 5.40s infinite"/><circle cx="296" cy="216" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 5.85s infinite"/><rect class="scan" x="0" y="0" width="410" height="2" fill="#00D4FF" opacity=".18"/><rect class="sw" x="0" y="0" width="140" height="220" fill="url(#sw)"/><text x="24" y="34" class="t">NetCore Technologies</text><rect class="cur" x="212" y="21" width="8" height="15" fill="#00D4FF"/><g class="row" style="animation-delay:0.00s"><text x="24" y="66" class="l">Public repos</text><text x="224" y="66" class="v" text-anchor="end">4</text><rect x="24" y="71" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="71" width="98" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.30s"/></g><g class="row" style="animation-delay:0.12s"><text x="24" y="91" class="l">Stars earned</text><text x="224" y="91" class="v" text-anchor="end">20</text><rect x="24" y="96" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="96" width="185" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.42s"/></g><g class="row" style="animation-delay:0.24s"><text x="24" y="116" class="l">Forks</text><text x="224" y="116" class="v" text-anchor="end">0</text><rect x="24" y="121" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="121" width="4" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.54s"/></g><g class="row" style="animation-delay:0.36s"><text x="24" y="141" class="l">Followers</text><text x="224" y="141" class="v" text-anchor="end">3</text><rect x="24" y="146" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="146" width="84" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.66s"/></g><g class="row" style="animation-delay:0.48s"><text x="24" y="166" class="l">Merged PRs</text><text x="224" y="166" class="v" text-anchor="end">26</text><rect x="24" y="171" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="171" width="200" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.78s"/></g><g class="row" style="animation-delay:0.60s"><text x="24" y="191" class="l">Open issues</text><text x="224" y="191" class="v" text-anchor="end">0</text><rect x="24" y="196" width="200" height="3" rx="1.5" fill="#14213D"/><rect class="bar" x="24" y="196" width="4" height="3" rx="1.5" fill="url(#ac)" style="animation-delay:0.90s"/></g><circle cx="330" cy="124" r="48" fill="none" stroke="#14213D" stroke-width="9"/><circle class="ring" cx="330" cy="124" r="48" fill="none" stroke="url(#ac)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 330 124)" filter="url(#gl)" style="--c:301.6;--o:286.5;stroke-dasharray:301.6"/><text x="330" y="112" class="l" text-anchor="middle">RANK</text><text x="330" y="141" class="big pulse" text-anchor="middle">C</text></g><rect x=".5" y=".5" width="409" height="219" rx="14" fill="none" stroke="#6C3BFF" stroke-opacity=".4"/><rect class="lap" pathLength="100" x=".5" y=".5" width="409" height="219" rx="14" fill="none" stroke="url(#ac)" stroke-width="2" filter="url(#gl)"/></svg>