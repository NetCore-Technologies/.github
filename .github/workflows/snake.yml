name: Generate Snake and Arcade

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tax Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@main
        continue-on-error: true
        with:
          github_user_name: TaxCollector23
          games: "pacman,breakout"

      - name: Set Tax arcade files aside
        continue-on-error: true
        run: |
          shopt -s nullglob
          mkdir -p keep dist
          for f in dist/*-contribution-graph*.svg; do
            mv "$f" "keep/tax-$(basename "$f")"
          done

      - name: Tax snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: TaxCollector23
          outputs: |
            dist/snake-tax.svg?color_snake=%2300D4FF&color_dots=%23161b22,%232a1f6b,%234a2fb8,%236C3BFF,%2300D4FF
            dist/snake-tax-dark.svg?palette=github-dark&color_snake=%2300D4FF&color_dots=%23161b22,%232a1f6b,%234a2fb8,%236C3BFF,%2300D4FF

      - name: Put arcade files back
        continue-on-error: true
        run: |
          mkdir -p dist
          cp keep/*.svg dist/ || true

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
