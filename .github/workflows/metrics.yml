name: Refresh org and founder stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: refresh-org-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Org cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: org
          STATS_OWNER: NetCore-Technologies
          STATS_OUT: profile/stats/org
          STATS_TITLE: NetCore Technologies
        run: python3 scripts/generate_stats.py

      - name: Manit cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: user
          STATS_OWNER: manit6752025
          STATS_OUT: profile/stats/manit
          STATS_TITLE: "@manit6752025"
        run: python3 scripts/generate_stats.py

      - name: Tax cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: user
          STATS_OWNER: TaxCollector23
          STATS_OUT: profile/stats/tax
          STATS_TITLE: "@TaxCollector23"
        run: python3 scripts/generate_stats.py

      - name: Commit and push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats
          git diff --cached --quiet && exit 0
          git commit -m "refresh org and founder stats"
          git pull --rebase origin main
          git push
