name: Refresh org, founder and project stats

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: refresh-org-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Org cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: org
          STATS_OWNER: NetCore-Technologies
          STATS_OUT: profile/stats/org
          STATS_TITLE: NetCore Technologies
          STATS_MEMBERS: manit6752025,TaxCollector23
        run: python3 scripts/generate_stats.py

      - name: Founder cards (Tax)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: user
        run: |
          STATS_OWNER=TaxCollector23 STATS_TITLE="Tax · CEO" STATS_OUT=profile/stats/tax python3 scripts/generate_stats.py

      - name: Project cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_KIND: projects
          STATS_OUT: profile/stats/projects
          STATS_PROJECTS: NetCore-Technologies/boxr,NetCore-Technologies/wifi-analyzer-pro,NetCore-Technologies/quantumgrid-os,manit6752025/AXIOM-AI
        run: python3 scripts/generate_stats.py

      - name: Commit and push
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats
          git diff --cached --quiet && exit 0
          git commit -m "refresh org, founder and project stats"
          git pull --rebase origin main
          git push
